<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>时空悖论 · 发行测试版</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body {
    background: #05050a; color: #e0e0e0;
    font-family: "Microsoft YaHei", sans-serif;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; overflow: hidden;
  }
  #game-container {
    position: relative; width: 100vw; height: 100vh;
    max-width: 960px; max-height: 620px;
    background: #111; border-radius: 12px; overflow: hidden;
    box-shadow: 0 0 60px rgba(0,0,0,0.9);
    user-select: none;
  }
  @media (max-width: 960px) { #game-container { border-radius: 0; max-height: none; height: 100vh; } }
  #scene-layer { position: absolute; inset: 0; transition: opacity 0.4s ease; }
  #scene-bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    transition: background 0.6s ease, filter 0.6s ease;
  }
  #scene-layer.camera-view #scene-bg {
    filter: contrast(1.2) brightness(0.78) sepia(0.2) hue-rotate(-15deg);
  }
  #scene-layer.camera-view::after {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(circle at center, transparent 52%, rgba(0,0,0,0.9) 100%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 3px);
    pointer-events: none; z-index: 2;
  }
  #scene-layer.camera-view::before {
    content: ""; position: absolute;
    top: 24px; left: 24px; right: 24px; bottom: 24px;
    border: 1px solid rgba(255,255,255,0.22);
    z-index: 3; pointer-events: none;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.55) 20px, transparent 20px),
      linear-gradient(to bottom, rgba(255,255,255,0.55) 20px, transparent 20px),
      linear-gradient(to left, rgba(255,255,255,0.55) 20px, transparent 20px),
      linear-gradient(to bottom, rgba(255,255,255,0.55) 20px, transparent 20px),
      linear-gradient(to right, rgba(255,255,255,0.55) 20px, transparent 20px),
      linear-gradient(to top, rgba(255,255,255,0.55) 20px, transparent 20px),
      linear-gradient(to left, rgba(255,255,255,0.55) 20px, transparent 20px),
      linear-gradient(to top, rgba(255,255,255,0.55) 20px, transparent 20px);
    background-position:
      top left, top left, top right, top right,
      bottom left, bottom left, bottom right, bottom right;
    background-size: 20px 2px, 2px 20px, 20px 2px, 2px 20px, 20px 2px, 2px 20px, 20px 2px, 2px 20px;
    background-repeat: no-repeat;
  }
  #scene-layer.red-view #scene-bg { filter: hue-rotate(-30deg) saturate(1.6) brightness(0.75); }
  .hotspot {
    position: absolute;
    border: 2px solid rgba(255,255,255,0.18);
    border-radius: 6px; cursor: pointer;
    transition: all 0.2s;
    background: rgba(255,255,255,0.04);
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.55); font-size: 12px;
    text-shadow: 0 0 6px #000; z-index: 4;
  }
  .hotspot:hover {
    border-color: #ffcc44; background: rgba(255,204,68,0.15);
    box-shadow: 0 0 16px rgba(255,204,68,0.5); color: #ffcc44;
  }
  .hotspot.use-mode { border-color: rgba(102,204,255,0.5); }
  .hotspot.use-mode:hover {
    border-color: #66ccff; background: rgba(102,204,255,0.18);
    box-shadow: 0 0 16px rgba(102,204,255,0.55); color: #66ccff;
  }
  #inventory {
    position: absolute; bottom: 0; left: 0; right: 0; height: 78px;
    background: rgba(8,8,12,0.94); border-top: 1px solid #333;
    display: flex; align-items: center; padding: 0 14px; gap: 12px;
    overflow-x: auto; z-index: 100; backdrop-filter: blur(8px);
  }
  .item-slot {
    width: 54px; height: 54px; flex-shrink: 0;
    border: 1px solid #444; border-radius: 10px; background: #1a1a1e;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; cursor: pointer; transition: all 0.2s; position: relative;
  }
  .item-slot:hover { border-color: #888; background: #222; transform: translateY(-2px); }
  .item-slot.selected {
    border-color: #ffcc44; box-shadow: 0 0 14px rgba(255,204,68,0.6);
    background: #2a2a1e; transform: translateY(-4px);
  }
  .item-slot .item-name {
    position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%);
    font-size: 10px; color: #aaa; white-space: nowrap;
  }
  #dialog-box {
    position: absolute; bottom: 96px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    width: 84%; max-width: 640px;
    background: rgba(0,0,0,0.9); border: 1px solid #555; border-radius: 10px;
    padding: 16px 22px; color: #eee; font-size: 15px; line-height: 1.7;
    opacity: 0; pointer-events: none; transition: all 0.3s;
    z-index: 20; text-align: center; white-space: pre-wrap;
  }
  #dialog-box.show {
    opacity: 1; transform: translateX(-50%) translateY(0);
    pointer-events: auto;
  }
  #password-modal {
    position: absolute; inset: 0; background: rgba(0,0,0,0.88);
    display: none; align-items: center; justify-content: center;
    z-index: 30; backdrop-filter: blur(6px);
  }
  #password-modal.show { display: flex; }
  .password-box {
    background: #1e1e24; border: 1px solid #555; border-radius: 14px;
    padding: 32px 28px; width: 340px; text-align: center;
    box-shadow: 0 0 40px rgba(0,0,0,0.9);
  }
  .password-box h3 { margin-bottom: 20px; font-size: 18px; color: #ffcc44; letter-spacing: 1px; }
  .password-box input {
    width: 100%; padding: 12px; font-size: 26px; text-align: center;
    letter-spacing: 8px; background: #0a0a0c; border: 1px solid #444;
    border-radius: 10px; color: #fff; outline: none; transition: border-color 0.2s;
  }
  .password-box input:focus { border-color: #ffcc44; }
  #password-time { display: none; align-items: center; justify-content: center; gap: 10px; }
  #password-time input { width: 90px; letter-spacing: 4px; font-size: 28px; }
  #password-time .colon {
    font-size: 32px; color: #ffcc44; font-weight: bold;
    animation: colonBlink 1.2s infinite;
  }
  @keyframes colonBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.3; } }
  .password-box .btns { display: flex; gap: 12px; margin-top: 22px; }
  .password-box button {
    flex: 1; padding: 11px; border: none; border-radius: 8px;
    font-size: 15px; cursor: pointer; transition: all 0.2s;
  }
  .password-box .confirm { background: #ffcc44; color: #111; font-weight: bold; }
  .password-box .confirm:hover { background: #ffdd66; }
  .password-box .cancel { background: #333; color: #ccc; }
  .password-box .cancel:hover { background: #444; }
  #hint {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.55); color: #aaa; padding: 6px 18px;
    border-radius: 20px; font-size: 12px; z-index: 15; pointer-events: none;
    border: 1px solid rgba(255,255,255,0.08); max-width: 80%; text-align: center;
  }
  #story-overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.9);
    display: none; align-items: center; justify-content: center;
    z-index: 40; padding: 40px;
  }
  #story-overlay.show { display: flex; }
  #story-text {
    font-size: 20px; color: #e8e8e8; text-align: center; line-height: 1.85;
    max-width: 640px; letter-spacing: 1px;
    text-shadow: 0 0 20px rgba(255,255,255,0.15);
    animation: storyFade 0.6s ease; white-space: pre-wrap;
  }
  @keyframes storyFade {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #camera-exit-btn {
    position: absolute; bottom: 96px; right: 24px; z-index: 25;
    background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.4);
    color: #fff; padding: 10px 18px; border-radius: 8px;
    font-size: 14px; cursor: pointer; display: none; letter-spacing: 1px;
  }
  #camera-exit-btn.show { display: block; }
  #camera-exit-btn:hover { background: rgba(255,255,255,0.15); }
  #chapter-overlay {
    position: absolute; inset: 0; background: #000;
    display: none; align-items: center; justify-content: center;
    z-index: 50; opacity: 0; transition: opacity 0.8s ease;
  }
  #chapter-overlay.show { display: flex; opacity: 1; }
  #chapter-overlay.fade-out { opacity: 0; }
  #chapter-title {
    font-size: 34px; letter-spacing: 6px; color: #d8d8d8; text-align: center;
    text-shadow: 0 0 30px rgba(255,204,68,0.25);
    animation: chapterFade 2s ease;
  }
  #chapter-sub {
    font-size: 14px; letter-spacing: 4px; color: #666;
    margin-top: 18px; text-align: center;
  }
  @keyframes chapterFade {
    0% { opacity: 0; letter-spacing: 18px; }
    100% { opacity: 1; letter-spacing: 6px; }
  }
/* ===== 存档面板 ===== */
.save-btn-top {
  position: absolute;
  top: 14px;
  right: 14px;
  z-index: 26;
  width: 40px; height: 40px;
  background: rgba(0,0,0,0.6);
  border: 1px solid rgba(255,255,255,0.3);
  color: #fff;
  border-radius: 50%;
  cursor: pointer;
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
}
.save-btn-top:hover { background: rgba(255,255,255,0.15); }

.save-panel {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: min(420px, 92%);
  background: #1a1a20;
  border: 1px solid #444;
  border-radius: 14px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.85);
  z-index: 60;
  color: #ddd;
  overflow: hidden;
}
.save-panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
  background: #232329;
  border-bottom: 1px solid #333;
}
.save-panel-head strong { font-size: 15px; color: #ffcc44; }
.save-panel-head .icon-btn {
  width: 30px; height: 30px; min-width: 30px;
  border: 1px solid #444; background: transparent;
  color: #ccc; font-size: 18px; cursor: pointer;
  border-radius: 6px; padding: 0;
}
.save-panel-head .icon-btn:hover { background: #333; }
.save-panel-body { padding: 16px; display: grid; gap: 12px; }
.save-row {
  display: grid;
  grid-template-columns: 70px 1fr auto;
  gap: 8px;
  align-items: center;
}
.save-row label { font-size: 13px; color: #aaa; }
.save-row input {
  padding: 7px 10px;
  background: #0d0d10;
  border: 1px solid #444;
  border-radius: 6px;
  color: #fff;
  font-size: 13px;
  outline: none;
}
.save-row input:focus { border-color: #ffcc44; }
.save-info {
  padding: 10px 12px;
  background: #101015;
  border: 1px solid #2a2a30;
  border-radius: 8px;
  font-size: 12.5px;
  color: #9a9a9a;
  line-height: 1.6;
  white-space: pre-wrap;
}
.save-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.save-actions button {
  padding: 9px 6px;
  border-radius: 8px;
  border: 1px solid transparent;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
}
.save-actions .primary { background: #ffcc44; color: #111; font-weight: bold; }
.save-actions .primary:hover { background: #ffdd66; }
.save-actions .secondary { background: #2a2a30; color: #ddd; border-color: #444; }
.save-actions .secondary:hover { background: #35353d; }
.save-actions .danger { background: #3a1a1a; color: #ff8888; border-color: #5a2a2a; }
.save-actions .danger:hover { background: #4a2020; }
.save-hint { font-size: 11.5px; color: #777; text-align: center; }
.debug-chapters {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.debug-chapters button {
  padding: 10px 4px;
  background: #2a2a30;
  border: 1px solid #444;
  color: #ddd;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
  line-height: 1.4;
}
.debug-chapters button:hover {
  background: #35353d;
  border-color: #ffcc44;
  color: #ffcc44;
}
.debug-chapters button .ch-num {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 2px;
}
.debug-chapters button .ch-name {
  display: block;
  font-size: 10px;
  color: #888;
}
.debug-chapters button:hover .ch-name { color: #bb9944; }

/* ===== 机关界面 ===== */
.mech-overlay {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.88);
  z-index: 45;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(6px);
}
.mech-shell {
  width: min(540px, 94%);
  max-height: 88%;
  background: #1a1a20;
  border: 1px solid #444;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.85);
  display: flex; flex-direction: column;
}
.mech-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
  background: #232329;
  border-bottom: 1px solid #333;
  flex-shrink: 0;
}
.mech-head strong { color: #ffcc44; font-size: 15px; }
.mech-head .icon-btn {
  width: 30px; height: 30px; min-width: 30px;
  border: 1px solid #444; background: transparent;
  color: #ccc; font-size: 18px; cursor: pointer;
  border-radius: 6px; padding: 0;
}
.mech-head .icon-btn:hover { background: #333; }
.mech-body {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  padding: 20px;
  overflow-y: auto;
  min-height: 260px;
}
.mech-part {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 14px 6px;
  background: #222229;
  border: 2px solid #3a3a44;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  position: relative;
  min-height: 92px;
}
.mech-part:hover { border-color: #ffcc44; background: #2a2a33; }
.mech-part.opened {
  border-color: #44cc88;
  background: #182a22;
}
.mech-part.opened:hover { border-color: #66ffaa; }
.mech-part.locked { opacity: 0.55; }
.mech-part.locked:hover { border-color: #666; background: #222229; }
.mech-part.highlight {
  box-shadow: 0 0 20px rgba(255,204,68,0.6);
  animation: mechPulse 1.4s infinite;
}
@keyframes mechPulse {
  0%, 100% { box-shadow: 0 0 12px rgba(255,204,68,0.4); }
  50% { box-shadow: 0 0 24px rgba(255,204,68,0.85); }
}
.mech-icon { font-size: 30px; margin-bottom: 6px; line-height: 1; }
.mech-label { font-size: 11px; color: #aaa; line-height: 1.35; }
.mech-part.opened .mech-label { color: #88ddaa; }
.mech-part .mech-badge {
  position: absolute; top: 4px; right: 4px;
  font-size: 10px; padding: 1px 5px; border-radius: 6px;
  background: #ffcc44; color: #111; font-weight: bold;
}
.mech-foot {
  padding: 10px 16px;
  background: #15151a;
  border-top: 1px solid #333;
  font-size: 12px; color: #888;
  text-align: center;
  flex-shrink: 0;
}


/* ===== 开始游戏界面 ===== */
.start-screen {
  position: absolute; inset: 0;
  z-index: 200;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  background:
    linear-gradient(90deg, rgba(3,6,8,0.08) 0%, rgba(3,6,8,0.30) 48%, rgba(3,6,8,0.74) 100%),
    radial-gradient(circle at 50% 42%, rgba(255,204,68,0.10), transparent 30%),
    url("ph/start.png") center center / cover no-repeat,
    #05070a;
}
.start-screen::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0 1px, transparent 1px 4px),
    radial-gradient(circle at center, transparent 45%, rgba(0,0,0,0.72) 100%);
}
.start-panel {
  position: relative;
  width: min(460px, 100%);
  padding: 40px 34px 28px;
  text-align: center;
  margin-left: auto; margin-right: 3%;
  background: rgba(8,11,15,0.78);
  border: 1px solid rgba(126,145,153,0.36);
  border-radius: 16px;
  box-shadow: 0 24px 80px rgba(0,0,0,0.82), inset 0 0 0 1px rgba(255,255,255,0.025);
  backdrop-filter: blur(8px);
}
.start-kicker {
  color: #8f8f9b; font-size: 12px; letter-spacing: 6px; margin-bottom: 14px;
}
.start-title {
  color: #f0e6ca; font-size: 38px; letter-spacing: 8px; line-height: 1.2;
  text-shadow: 0 0 28px rgba(255,204,68,0.3);
}
.start-subtitle {
  margin: 14px 0 28px; color: #858590; font-size: 13px; letter-spacing: 2px;
}
.start-actions {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
}
.start-btn {
  min-height: 50px; padding: 10px 16px;
  border-radius: 9px; cursor: pointer;
  font-family: inherit; font-size: 15px; letter-spacing: 2px;
  transition: transform 0.15s, border-color 0.15s, background 0.15s, color 0.15s;
}
.start-btn:hover:not(:disabled) { transform: translateY(-2px); }
.start-btn.primary {
  color: #15110a; background: #d9ad3c; border: 1px solid #f0c85a;
  font-weight: bold;
}
.start-btn.primary:hover { background: #efc552; box-shadow: 0 0 22px rgba(255,204,68,0.28); }
.start-btn.secondary {
  color: #ddd; background: #24242c; border: 1px solid #4a4a56;
}
.start-btn.secondary:hover:not(:disabled) { color: #ffcc44; border-color: #b58e2f; background: #2d2d36; }
.start-btn:disabled {
  color: #666; background: #18181e; border-color: #2e2e36;
  cursor: not-allowed; opacity: 0.7;
}
.start-save-info {
  min-height: 38px; margin-top: 22px; padding-top: 16px;
  border-top: 1px solid #292931;
  color: #777781; font-size: 11px; line-height: 1.7; white-space: pre-line;
}
@media (max-width: 720px) {
  .start-panel { margin: 0; }
}
@media (max-width: 480px) {
  .start-panel { padding: 34px 22px 24px; }
  .start-title { font-size: 30px; letter-spacing: 6px; }
  .start-actions { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="game-container">
  <div id="start-screen" class="start-screen">
    <div class="start-panel">
      <div class="start-kicker">解密游戏</div>
      <h1 class="start-title">时空悖论</h1>
      <p class="start-subtitle">选择一种方式进入故事</p>
      <div class="start-actions">
        <button id="start-new-btn" class="start-btn primary" type="button">开始游戏</button>
        <button id="start-load-btn" class="start-btn secondary" type="button">载入存档</button>
      </div>
      <div id="start-save-info" class="start-save-info">正在检查存档……</div>
    </div>
  </div>
  <audio id="bgm" src="ph/bgm.mp3" loop preload="auto" aria-hidden="true"></audio>
  <div id="scene-layer"><div id="scene-bg"></div></div>
  <div id="inventory"></div>
  <div id="dialog-box"></div>
  <button id="camera-exit-btn">📷 放下相机</button>
  <button id="save-toggle-btn" class="save-btn-top" type="button" title="存档管理">💾</button>
  <button id="debug-toggle-btn" class="save-btn-top" type="button" title="调试器" style="right: 62px;">🐞</button>
  <div id="story-overlay"><div id="story-text"></div></div>
<!-- 机关界面 -->
<div id="mechanism-overlay" class="mech-overlay" hidden>
  <div class="mech-shell">
    <div class="mech-head">
      <strong id="mechanism-title">机关</strong>
      <button id="mechanism-close" class="icon-btn" type="button">×</button>
    </div>
    <div id="mechanism-body" class="mech-body"></div>
    <div class="mech-foot">
      <span id="mechanism-hint"></span>
    </div>
  </div>
</div>
  <div id="chapter-overlay"><div><div id="chapter-title"></div><div id="chapter-sub"></div></div></div>
  <div id="password-modal">
    <div class="password-box">
      <h3 id="password-title">请输入密码</h3>
      <div id="password-simple"><input type="text" id="password-input" maxlength="8" autocomplete="off"></div>
      <div id="password-time">
        <input type="text" id="time-hour" maxlength="2" inputmode="numeric" autocomplete="off" placeholder="HH">
        <span class="colon">:</span>
        <input type="text" id="time-minute" maxlength="2" inputmode="numeric" autocomplete="off" placeholder="MM">
      </div>
      <div class="btns">
        <button class="cancel" id="password-cancel">取消</button>
        <button class="confirm" id="password-confirm">确认</button>
      </div>
    </div>
  </div>
  <div id="hint">点击场景中的高亮区域进行调查</div>
<!-- 存档面板 -->
<div id="save-panel" class="save-panel" hidden>
  <div class="save-panel-head">
    <strong>存档管理</strong>
    <button id="save-panel-close" class="icon-btn" type="button">×</button>
  </div>
  <div class="save-panel-body">
    <div class="save-row">
      <label>玩家 ID</label>
      <input id="save-player-id" type="text" maxlength="32" autocomplete="off">
      <button id="save-apply-id" class="secondary" type="button">切换</button>
    </div>
    <div class="save-info" id="save-info">当前无存档</div>
    <div class="save-actions">
      <button id="save-btn" class="primary" type="button">立即保存</button>
      <button id="load-btn" class="secondary" type="button">读取存档</button>
      <button id="export-btn" class="secondary" type="button">导出文件</button>
      <button id="import-btn" class="secondary" type="button">导入文件</button>
      <button id="clear-btn" class="danger" type="button">删除存档</button>
    </div>
    <input id="import-file" type="file" accept=".json,application/json" hidden>
    <div class="save-hint">存档自动保存，每 20 秒或切换场景时刷新一次。</div>
  </div>
</div>
<div id="debug-panel" class="save-panel" hidden>
  <div class="save-panel-head">
    <strong>🐞 调试器</strong>
    <button id="debug-panel-close" class="icon-btn" type="button">×</button>
  </div>
  <div class="save-panel-body">
    <div class="save-info" id="debug-info">
      调试模式已开启，存档功能已封锁。
      点击下方章节可直接跳转。
    </div>
    <div id="debug-chapters" class="debug-chapters"></div>
    <div class="save-actions" style="grid-template-columns: 1fr;">
      <button id="debug-exit-btn" class="danger" type="button">关闭本次调试（回到第一章）</button>
    </div>
    <div class="save-hint">刷新页面也会自动退出调试模式。</div>
  </div>
</div>
</div>

<script>
/* ============================================================
 *  时空悖论 · 第一章至第七章
 * ============================================================ */

const gameData = {
  startScene: 'office',

  chapters: {
    1: { title: '第一章', sub: '时间悖论' },
    2: { title: '第二章', sub: '时空钟' },
    3: { title: '第三章', sub: '悖论加深' },
    4: { title: '第四章', sub: '出口' },
    5: { title: '第五章', sub: '到底这是我，还是那是我' },
    6: { title: '第六章', sub: '自我悖论' },
    7: { title: '第七章', sub: '这位大师是什么人' },
    8: { title: '第八章', sub: '如果时间可以存在悖论' },
    9: { title: '第九章', sub: '始终没有出来的悖论' },
    10: { title: '第十章', sub: '递归的尽头' },
    11: { title: '第十一章', sub: '我？我为什么要我这样？' }
  },

  scenes: {

    /* ============ 第一章 ============ */
    office: {
      name: '私人办公室', chapter: 1,
      background: 'url("ph/office.png") center/cover no-repeat',
      onEnter: () => {
        if (!state.flags.ch1Intro) {
          state.flags.ch1Intro = true;
          showStory('你猛地睁开眼睛。\n头痛欲裂。\n\n这是你的私人办公室，\n可你记得……自己明明应该\n在实验室里值班。', 4200, null);
        }
      },
      hotspots: [
        { id: 'desk', name: '办公桌', rect: { left: 12, top: 55, width: 34, height: 22 },
          onClick: () => {
            if (!state.flags.hasClock) {
              state.flags.hasClock = true;
              addItem('clock');
              showDialog('桌上放着一个金属闹钟，冷得刺骨。\n\n指针停在 08:12——\n像是被人刻意停在那里。\n\n这是……特尼斯公司的「时间钟」？');
            } else {
              showDialog('桌上只剩下摊开的实验日志。\n上面写着一句被划掉的话：\n「不可更改。不可更替。不可言语。」');
            }
            return true;
          }
        },
        { id: 'drawer', name: '抽屉', rect: { left: 54, top: 68, width: 20, height: 12 },
          onClick: () => {
            if (state.flags.drawerUnlocked) { showDialog('抽屉里空了，只剩一个空的相框。'); return true; }
            if (!state.flags.hasClock) {
              showDialog('锁是四位数字的密码盘。\n\n不知道密码……\n房间里或许有线索。');
              return true;
            }
            showPasswordLock('抽屉上的密码锁（四位数字）', '0812', () => {
              state.flags.drawerUnlocked = true;
              showDialog('咔嚓——\n\n抽屉打开，里面有一把铜钥匙，\n和一张烧毁了一半的合影。');
              addItem('key'); addItem('photo');
            });
            return true;
          }
        },
        { id: 'board', name: '公告板', rect: { left: 74, top: 24, width: 22, height: 22 },
          onClick: () => {
            if (!state.flags.readBoard) {
              state.flags.readBoard = true;
              showStory('公告板上贴着几张纸：\n\n【剪报】\n「特尼斯公司发布「时空钟」样机，\n称其为"人类观察历史的第一只眼睛"。\n使用者将以"观察者"身份进入过去，\n持续 60 万毫秒后强制返回。」\n\n【值班表】\nL. Levis    08:12 — 17:30\nH. Grey     17:30 — 次日 08:12', 6200, null);
            } else { showDialog('值班表的日期是一个月前。\n正好是利维斯出事的那一周。'); }
            return true;
          }
        },
        { id: 'door', name: '办公室门', rect: { left: 84, top: 40, width: 14, height: 46 },
          onClick: () => {
            if (state.inventory.includes('key')) {
              showDialog('你用铜钥匙打开了门。\n走廊的灯在闪。');
              setTimeout(() => changeScene('corridorA'), 1000);
            } else { showDialog('门被从外面锁上了。\n需要一把钥匙。'); }
            return true;
          }
        }
      ]
    },

    corridorA: {
      name: '走廊 A', chapter: 1,
      background: 'url("ph/corridorA.png") center/cover no-repeat',
      hotspots: [
        { id: 'backOffice', name: '返回办公室', rect: { left: 3, top: 80, width: 16, height: 12 },
          onClick: () => { changeScene('office'); return true; } },
        { id: 'obsWindow', name: '观察窗', rect: { left: 26, top: 34, width: 22, height: 22 },
          onClick: () => { showStory('你透过玻璃看向主实验室：\n\n液压机静静地悬在半空，\n工作台上散落着工具。\n\n一切如常——\n但你就是觉得哪里不对。', 3600, null); return true; } },
        { id: 'labDoor', name: '实验室门', rect: { left: 56, top: 34, width: 18, height: 46 },
          onClick: () => { showDialog('你推开了实验室的门。'); setTimeout(() => changeScene('labMain'), 800); return true; } },
        { id: 'vending', name: '售货机', rect: { left: 78, top: 56, width: 12, height: 26 },
          onClick: () => { showDialog('售货机还在亮着，\n玻璃上映出你自己的脸——\n疲惫，苍白，像是好几天没睡。'); return true; } }
      ]
    },

    labMain: {
      name: '主实验室', chapter: 1,
      background: 'url("ph/labMain.png") center/cover no-repeat',
      onEnter: () => {
        if (!state.flags.ch1LabIntro) {
          state.flags.ch1LabIntro = true;
          showStory('液压机安静地悬在半空。\n\n地面被清理得很干净，\n但你依然能闻到\n淡淡的铁锈味。', 4000, null);
        }
      },
      hotspots: [
        { id: 'backCorridor', name: '返回走廊', rect: { left: 3, top: 80, width: 16, height: 12 },
          onClick: () => { changeScene('corridorA'); return true; } },
        { id: 'press', name: '液压机', rect: { left: 30, top: 30, width: 28, height: 34 },
          onClick: () => {
            if (!state.flags.sawPress) {
              state.flags.sawPress = true;
              showStory('你靠近液压机。\n\n金属底座上，有一道洗不掉的暗红色印记。\n\n你想起一个月前那个下午——\n利维斯被压成一张薄薄的、\n几乎透明的人饼。', 5000, null);
            } else { showDialog('你不敢再看那道印记。'); }
            return true;
          } },
        { id: 'workbench', name: '工具台', rect: { left: 62, top: 58, width: 26, height: 18 },
          onClick: () => {
            if (!state.flags.gotSaw) {
              state.flags.gotSaw = true;
              addItem('juzi1');
              showDialog('工具台上放着一把生锈的锯子。\n你把它放进了口袋。');
            } else { showDialog('工具台上只剩下些零散螺丝。'); }
            return true;
          } },
        { id: 'levisDesk', name: '利维斯的工位', rect: { left: 14, top: 52, width: 16, height: 22 },
          onClick: () => {
            if (!state.flags.readLevis) {
              state.flags.readLevis = true;
              showStory('利维斯的工位还保持着他离开时的样子。\n\n桌上的便签上写着一行字：\n\n「灰叔，如果实验出问题，\n请一定不要回头。——L」\n\n你握紧了那把锯子。', 5000, null);
            } else { showDialog('便签上墨迹已经干了。'); }
            return true;
          } },
        { id: 'nextDoor', name: '里间的门', rect: { left: 84, top: 36, width: 14, height: 48 },
          onClick: () => {
            if (!state.flags.gotSaw) { showDialog('门把手上沾着一层灰。\n你直觉先进工具台看看更稳妥。'); return true; }
            showStory('你推开了里间的门……\n空气一下子变了。', 2200, () => { changeScene('corridorB'); });
            return true;
          } }
      ]
    },

    /* ============ 第二章 ============ */
    corridorB: {
      name: '走廊 B', chapter: 2,
      background: 'url("ph/corridorB.png") center/cover no-repeat',
      onEnter: () => {
        if (!state.flags.ch2Intro) {
          state.flags.ch2Intro = true;
          showChapter(2, () => {
            showStory('走廊尽头，是一扇半掩的门。\n\n门缝里透出的光\n忽明忽暗。', 3600, null);
          });
        }
      },
      hotspots: [
        { id: 'backLab', name: '返回主实验室', rect: { left: 3, top: 80, width: 16, height: 12 },
          onClick: () => { changeScene('labMain'); return true; } },
        { id: 'windowB', name: '走廊窗', rect: { left: 30, top: 24, width: 24, height: 26 },
          onClick: () => { showStory('窗外一片漆黑。\n不是夜——是那种「什么都没有」的漆黑。\n\n你往下看，深不见底。\n抬头，头顶似乎还有一层……', 4200, null); return true; } },
        { id: 'sideDoor', name: '半掩的门', rect: { left: 62, top: 32, width: 20, height: 48 },
          onClick: () => { showDialog('你推门走了进去。'); setTimeout(() => changeScene('labSide'), 800); return true; } }
      ]
    },

    labSide: {
      name: '侧实验室', chapter: 2,
      background: 'url("ph/labSide.png") center/cover no-repeat',
      cameraBackground: 'url("ph/labSide_camera.png") center/cover no-repeat',
      onEnter: () => {
        if (!state.flags.ch2SideIntro) {
          state.flags.ch2SideIntro = true;
          showStory('你走进这个房间。\n\n正中站着一个……模特假人？\n不，它太逼真了。\n\n窗外漆黑如墨，\n窗外深不见底。', 4400, null);
        }
      },
      hotspots: [
        { id: 'backCorridorB', name: '返回走廊', rect: { left: 3, top: 82, width: 16, height: 11 },
          visible: () => !state.flags.cameraView && !state.flags.mannequinStuck,
          onClick: () => { changeScene('corridorB'); return true; } },
        { id: 'window', name: '窗户', rect: { left: 38, top: 16, width: 26, height: 32 },
          visible: () => !state.flags.cameraView,
          onClick: () => {
            if (state.flags.mannequinStuck) { showDialog('假人的身体死死卡在窗框里，\n一动不动。'); return true; }
            if (state.selectedItem === 'hand') {
              removeItem('hand'); state.selectedItem = null;
              state.flags.handThrown = true; renderInventory(); playMannequinStory(); return true;
            }
            if (state.flags.handThrown) { showDialog('窗外漆黑一片。手已经扔下去了。'); return true; }
            showStory('你趴在窗沿往下看。\n\n深不见底。\n\n风从下面吹上来，\n带着一股说不出的腥味。', 3600, null);
            return true;
          } },
        { id: 'table', name: '桌子', rect: { left: 8, top: 62, width: 22, height: 15 },
          visible: () => !state.flags.cameraView,
          onClick: () => { showDialog('桌子上什么都没有，\n只有一层很厚的灰。'); return true; } },
        { id: 'flowerpot', name: '花盆', rect: { left: 30, top: 72, width: 14, height: 12 },
          visible: () => !state.flags.cameraView,
          onClick: () => {
            if (state.flags.hasCamera) { showDialog('花盆里已经什么都没有了。'); return true; }
            if (state.selectedItem === 'hand') {
              state.selectedItem = null; state.flags.hasCamera = true;
              showDialog('你用手挖开花盆里的泥土，\n指尖碰到一个冰凉坚硬的东西——\n\n是一台老式相机。');
              addItem('camera'); renderInventory(); return true;
            }
            showDialog('泥土结得很硬，徒手挖不动。\n需要用什么东西来挖……');
            return true;
          } },
        { id: 'mannequin', name: '模特假人',
          rect: () => state.flags.mannequinStuck
            ? { left: 40, top: 20, width: 22, height: 28 }
            : { left: 62, top: 40, width: 16, height: 44 },
          visible: () => !state.flags.cameraView,
          onClick: () => {
            if (state.flags.mannequinStuck) {
              showStory('你踩着假人冰冷的身体，\n从窗户钻了上去……', 1800, () => { changeScene('attic'); });
              return true;
            }
            if (state.selectedItem === 'juzi1') {
              if (state.flags.handSawn) { showDialog('假人已经没有手可以锯了。'); }
              else {
                state.selectedItem = null; state.flags.handSawn = true;
                showDialog('你举起了锯子……\n咔嚓——\n假人的右手掉了下来。\n\n触感……不像塑料。');
                addItem('hand'); renderInventory();
              }
              return true;
            }
            if (state.flags.handSawn) { showDialog('假人失去了右手，静静地站着。\n\n它的头……好像偏过来了一点。'); return true; }
            showDialog('一个老旧的模特假人。\n它的右臂似乎可以活动。');
            return true;
          } },
        { id: 'painting', name: '一幅画', rect: { left: 30, top: 12, width: 22, height: 26 },
          visible: () => state.flags.cameraView,
          onClick: () => {
            state.flags.sawPainting = true;
            showStory('你举起相机对准那面墙。\n\n——墙上多出了一幅画。\n\n画上写着：\n\n8:50 - 9', 4200, null);
            return true;
          } }
      ]
    },

    /* ============ 第三章 ============ */
    attic: {
      name: '阁楼', chapter: 3,
      background: 'url("ph/attic.png") center/cover no-repeat',
      onEnter: () => {
        if (!state.flags.ch3Intro) {
          state.flags.ch3Intro = true;
          showChapter(3, () => {
            showStory('你从窗户爬了上来。\n\n这里……比从外面看到的\n要大得多。\n\n仿佛整栋楼都在往这里\n倾泻空间。', 4400, null);
          });
        }
      },
      hotspots: [
        { id: 'backSide', name: '回到下方', rect: { left: 3, top: 82, width: 16, height: 11 },
          onClick: () => { showDialog('往下看——窗户已经不见了。\n只有一片黑暗。'); return true; } },
        { id: 'ironDoor', name: '铁门', rect: { left: 38, top: 28, width: 24, height: 52 },
          onClick: () => {
            if (state.flags.door3Opened) { showDialog('门已经打开了。'); return true; }
            showPasswordLock('铁门上的时间锁', '23:50', () => {
              state.flags.door3Opened = true;
              showStory('咔哒——\n\n门后是一条漫长的走廊。\n你看到了 201、202、203……\n\n走廊尽头，站立着一个\n和你长得一模一样的影子。', 5200, () => { changeScene('cycleCorridor'); });
            }, { type: 'time' });
            return true;
          } },
        { id: 'atticWindow', name: '阁楼小窗', rect: { left: 70, top: 40, width: 18, height: 22 },
          onClick: () => { showStory('你透过小窗往外看。\n\n窗外没有城市。\n没有天空。\n\n只有一条长长的、\n无限延伸的走廊——\n和你脚下这条一模一样。', 4600, null); return true; } }
      ]
    },

    cycleCorridor: {
      name: '循环走廊', chapter: 3,
      background: 'url("ph/cycleCorridor.png") center/cover no-repeat',
      onEnter: () => {
        if (!state.flags.ch3Corridor) {
          state.flags.ch3Corridor = true;
          showStory('你走进走廊。\n\n门牌号从 201 一直排到 208。\n\n你数了一遍。\n\n再数一遍。\n\n——还是 8 个。\n\n可你总觉得……\n少了一个。', 5200, null);
        }
      },
      hotspots: [
        { id: 'backAttic', name: '回到阁楼', rect: { left: 3, top: 82, width: 16, height: 11 },
          onClick: () => { changeScene('attic'); return true; } },
        { id: 'door207', name: '207 房间', rect: { left: 28, top: 32, width: 14, height: 44 },
          onClick: () => {
            showDialog('门把手上缠着一层新鲜的、\n黏腻的东西。\n\n你鼓起勇气推开了门……');
            setTimeout(() => changeScene('room207'), 900);
            return true;
          } },
        { id: 'door208', name: '208 房间', rect: { left: 60, top: 32, width: 14, height: 44 },
          onClick: () => {
            showDialog('门缝里渗出暗红色的液体。\n\n你推开了它……');
            setTimeout(() => changeScene('room208'), 900);
            return true;
          } },
        { id: 'mirrorShadow', name: '走廊尽头', rect: { left: 84, top: 30, width: 12, height: 44 },
          onClick: () => { showDialog('走廊尽头，那个影子\n缓缓地转过了头……\n\n你不敢再看他。'); return true; } }
      ]
    },

    /* ============ 第四章 ============ */
    room207: {
      name: '207 房间', chapter: 4,
      background: 'url("ph/room207.png") center/cover no-repeat',
      onEnter: () => {
        if (!state.flags.ch4Intro) {
          state.flags.ch4Intro = true;
          showChapter(4, () => {
            showStory('207 房间。\n\n这里和你自己的实验室一模一样。\n\n液压机悬在半空，\n底下……躺着一个人。', 4200, null);
          });
        }
      },
      hotspots: [
        { id: 'back207', name: '回到走廊', rect: { left: 3, top: 82, width: 16, height: 11 },
          onClick: () => { changeScene('cycleCorridor'); return true; } },
        { id: 'body207', name: '液压机下的尸体', rect: { left: 30, top: 55, width: 26, height: 22 },
          onClick: () => {
            if (!state.flags.sawBody207) {
              state.flags.sawBody207 = true;
              showStory('你走过去。\n\n尸体的头骨已经碎得不成样子——\n是利维斯。\n\n液压机是抬起来的。\n他死了，却没有被压。', 5000, null);
            } else if (!state.flags.boneMovedIn207) {
              showDialog('你抓住尸体的手，\n把它往旁边挪了一米。');
              state.flags.boneMovedIn207 = true;
              showStory('就在这一瞬间——\n\n你感到整个房间\n似乎颤动了一下。', 2800, null);
            } else {
              showDialog('尸体已经挪到旁边了。');
            }
            return true;
          } },
        { id: 'wall207', name: '内侧墙壁', rect: { left: 62, top: 30, width: 22, height: 34 },
          onClick: () => {
            if (state.flags.boneMovedIn207) {
              showDialog('墙壁上浮现出一道\n你从未见过的暗门。\n\n（它似乎……只在挪动尸体后才存在）');
              state.flags.wall207Opened = true;
            } else {
              showDialog('普通的墙壁，什么也没有。');
            }
            return true;
          } }
      ]
    },

    room208: {
      name: '208 房间', chapter: 4,
      background: 'url("ph/room208.png") center/cover no-repeat',
      onEnter: () => {
        if (!state.flags.ch4Room208Intro) {
          state.flags.ch4Room208Intro = true;
          showStory('你踏进 208。\n\n……\n\n这里和你自己的实验室\n完全不同。\n\n满地碎肉与暗红。\n各种机关和刀片悬在头顶。\n\n房间最深处，有一扇门。', 5200, null);
        }
      },
      hotspots: [
        { id: 'back208', name: '回到走廊', rect: { left: 3, top: 82, width: 16, height: 11 },
          onClick: () => { changeScene('cycleCorridor'); return true; } },
        { id: 'bone208', name: '骸骨', rect: { left: 32, top: 60, width: 20, height: 18 },
          onClick: () => {

/* ============================================================
 *  存档管理器 SaveManager
 * ============================================================ */
const SaveManager = {
  SAVE_PREFIX: 'shikong_save_',
  PLAYER_KEY:  'shikong_player_id',
  VERSION:     '1.0',
  disabled: false,   // ★ 调试模式时置 true
  _autoTimer:  null,
  _dirty:      false,

  // ---------- 玩家 ID ----------
  // 登录用户 ID 通过父页面以 ?player=... 传入，优先于本机历史游客 ID。
  getLoginPlayerId() {
    const id = new URLSearchParams(location.search).get('player');
    return id ? id.trim() : '';
  },

  isLoginPlayerLocked() {
    return this.getLoginPlayerId() !== '';
  },

  getPlayerId() {
    const loginId = this.getLoginPlayerId();
    if (loginId) {
      localStorage.setItem(this.PLAYER_KEY, loginId);
      return loginId;
    }

    let id = localStorage.getItem(this.PLAYER_KEY);
    if (!id) {
      id = 'guest_' + Math.random().toString(36).substring(2, 10);
      localStorage.setItem(this.PLAYER_KEY, id);
    }
    return id;
  },

  setPlayerId(id) {
    if (!id || !/^[a-zA-Z0-9_\-]{1,32}$/.test(id)) return false;
    localStorage.setItem(this.PLAYER_KEY, id);
    return true;
  },

  _key(playerId) { return this.SAVE_PREFIX + playerId; },

  // ---------- 序列化当前状态 ----------
  _serialize() {
    const scene = gameData.scenes[state.currentScene];
    return {
      version:     this.VERSION,
      playerId:    this.getPlayerId(),
      savedAt:     Date.now(),
      savedAtText: new Date().toLocaleString('zh-CN'),
      currentScene: state.currentScene,
      chapter:      scene ? (scene.chapter || 1) : 1,
      sceneName:    scene ? scene.name : '未知场景',
      inventory:    [...state.inventory],
      flags:        Object.assign({}, state.flags),
      // 不存 selectedItem / busy / isTransitioning（临时状态无需恢复）
    };
  },

  // ---------- 保存 ----------
  save(silent = true) {
    // ★ 调试模式封锁
    if (this.disabled) {
      if (!silent) showDialog('调试模式下存档已封锁。');
      return false;
    }
    // ↑↑ 上面是新增的，下面是原有代码 ↓↓
    try {
      const data = this._serialize();
      localStorage.setItem(this._key(data.playerId), JSON.stringify(data));
      this._dirty = false;
      if (!silent) showDialog('存档已保存。', 1500);
      return true;
    } catch (e) {
      console.error('保存失败:', e);
      if (!silent) showDialog('保存失败：' + e.message);
      return false;
    }
  },

  markDirty() { this._dirty = true; },

  // ---------- 读取 ----------
  load(playerId) {
    playerId = playerId || this.getPlayerId();
    const raw = localStorage.getItem(this._key(playerId));
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (e) { return null; }
  },

  // ---------- 应用存档到状态（不触发场景 onEnter，避免重复剧情）----------
  apply(data) {
    if (!data || !data.currentScene) return false;
    state.currentScene = data.currentScene;
    state.inventory    = Array.isArray(data.inventory) ? [...data.inventory] : [];
    state.flags        = (data.flags && typeof data.flags === 'object') ? Object.assign({}, data.flags) : {};
    state.selectedItem = null;
    state.busy         = false;
    state.isTransitioning = false;

    // 刷新 UI
    updateBackground();
    renderHotspots();
    renderInventory();
    return true;
  },

  // ---------- 删除 ----------
  clear(playerId) {
    playerId = playerId || this.getPlayerId();
    localStorage.removeItem(this._key(playerId));
  },

  // ---------- 列出所有存档 ----------
  listAll() {
    const arr = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(this.SAVE_PREFIX)) {
        try {
          const d = JSON.parse(localStorage.getItem(k));
          if (d && d.playerId) arr.push(d);
        } catch (_) {}
      }
    }
    return arr.sort((a, b) => b.savedAt - a.savedAt);
  },

  // ---------- 导出为文件 ----------
  exportFile() {
    const data = this.load();
    if (!data) { showDialog('没有找到存档。'); return; }
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `shikong_${data.playerId}_${Date.now()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showDialog('存档已导出为文件。');
  },

  // ---------- 从文件导入 ----------
  importFile(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          if (!data || !data.currentScene) throw new Error('不是有效的存档文件');
          // 登录用户存档必须归入当前登录 ID；未登录时保留导入文件中的 ID。
          if (this.isLoginPlayerLocked()) {
            data.playerId = this.getPlayerId();
          } else if (data.playerId && /^[a-zA-Z0-9_\-]{1,32}$/.test(data.playerId)) {
            this.setPlayerId(data.playerId);
          } else {
            data.playerId = this.getPlayerId();
          }
          localStorage.setItem(this._key(data.playerId), JSON.stringify(data));
          resolve(data);
        } catch (err) { reject(err); }
      };
      reader.onerror = reject;
      reader.readAsText(file);
    });
  },

  // ---------- 自动保存 ----------
  startAutoSave(intervalMs = 20000) {
    if (this._autoTimer) clearInterval(this._autoTimer);
    this._autoTimer = setInterval(() => {
      if (!this.disabled && this._dirty) this.save(true);
    }, intervalMs);

    // 关闭页面前再存一次
    window.addEventListener('beforeunload', () => {
      if (!this.disabled && this._dirty) this.save(true);
    });

    // 切到其他标签页时存一次
    document.addEventListener('visibilitychange', () => {
      if (!this.disabled && document.hidden && this._dirty) this.save(true);
    });
  }
};

let bgmUnlockHandler = null;

function tryPlayBgm() {
  if (!bgmAudio) return;
  bgmAudio.volume = 0.38;
  try {
    const promise = bgmAudio.play();
    if (promise && typeof promise.catch === 'function') {
      promise.catch(() => {
        if (bgmUnlockHandler) return;

        bgmUnlockHandler = () => {
          document.removeEventListener('pointerdown', bgmUnlockHandler, true);
          document.removeEventListener('keydown', bgmUnlockHandler, true);
          bgmUnlockHandler = null;
          bgmAudio.play().catch(() => {});
        };

        document.addEventListener('pointerdown', bgmUnlockHandler, { once: true, capture: true });
        document.addEventListener('keydown', bgmUnlockHandler, { once: true, capture: true });
      });
    }
  } catch (_) {}
}

/* ============================================================
 *  场景切换
 * ============================================================ */
function changeScene(sceneId) {
  if (state.isTransitioning) return;
  const scene = gameData.scenes[sceneId];
  if (!scene) return;

  state.isTransitioning = true;
  sceneLayer.style.opacity = '0';

  setTimeout(() => {
    state.currentScene = sceneId;
    state.selectedItem = null;
    state.flags.cameraView = false;
    updateBackground();
    renderHotspots();
    renderInventory();
    sceneLayer.style.opacity = '1';
    state.isTransitioning = false;

    const newScene = gameData.scenes[sceneId];
    if (newScene && typeof newScene.onEnter === 'function') {
      newScene.onEnter();
    }

    SaveManager.markDirty();      // ★ 新增
    SaveManager.save(true);       // ★ 新增：切场景立刻存一次
  }, 400);
}

function updateBackground() {
  const scene = gameData.scenes[state.currentScene];
  if (!scene) return;
  if (state.flags.cameraView && scene.cameraBackground) {
    sceneBg.style.background = scene.cameraBackground;
    sceneLayer.classList.add('camera-view');
    cameraExitBtn.classList.add('show');
  } else {
    sceneBg.style.background = scene.background;
    sceneLayer.classList.remove('camera-view');
    cameraExitBtn.classList.remove('show');
  }
}

/* ============================================================
 *  热点渲染
 * ============================================================ */
function renderHotspots() {
  document.querySelectorAll('.hotspot').forEach(el => el.remove());

  const scene = gameData.scenes[state.currentScene];
  if (!scene) return;

  updateBackground();

  scene.hotspots.forEach(hs => {
    if (hs.visible && !hs.visible()) return;

    const rect = typeof hs.rect === 'function' ? hs.rect() : hs.rect;

    const el = document.createElement('div');
    el.className = 'hotspot';
    if (state.selectedItem) el.classList.add('use-mode');
    el.dataset.id = hs.id;
    el.style.left   = rect.left + '%';
    el.style.top    = rect.top + '%';
    el.style.width  = rect.width + '%';
    el.style.height = rect.height + '%';
    el.textContent = hs.name;

    el.addEventListener('click', (e) => {
      e.stopPropagation();
      if (state.busy) return;

      const beforeItem = state.selectedItem;
      if (hs.onClick) hs.onClick();
      if (state.selectedItem === beforeItem && beforeItem !== null) {
        state.selectedItem = null;
      }

      renderInventory();
      renderHotspots();
    });

    sceneLayer.appendChild(el);
  });
}

/* ============================================================
 *  物品栏
 * ============================================================ */
function renderInventory() {
  inventoryEl.innerHTML = '';
  state.inventory.forEach(itemId => {
    const item = gameData.items[itemId];
    if (!item) return;

    const slot = document.createElement('div');
    slot.className = 'item-slot' + (state.selectedItem === itemId ? ' selected' : '');
    slot.dataset.id = itemId;
    slot.title = item.name + '：' + (item.description || '');
    slot.innerHTML = item.icon + `<span class="item-name">${item.name}</span>`;

    slot.addEventListener('click', (e) => {
      e.stopPropagation();
      const mechanismOpen = !document.getElementById('mechanism-overlay').hidden;
      if (state.busy && !mechanismOpen) return;

      if (item.onUse) { item.onUse(); return; }

      if (state.selectedItem === itemId) {
        state.selectedItem = null;
      } else {
        state.selectedItem = itemId;
        showDialog(`选中了【${item.name}】，点击场景中的目标使用。`, 1500);
      }
      renderInventory();
      renderHotspots();
      if (mechanismOpen) renderMechanism();
    });

    inventoryEl.appendChild(slot);
  });
}

function addItem(itemId) {
  if (!state.inventory.includes(itemId)) {
    state.inventory.push(itemId);
    renderInventory();
    SaveManager.markDirty();      // ★ 新增
  }
}

function removeItem(itemId) {
  const idx = state.inventory.indexOf(itemId);
  if (idx >= 0) {
    state.inventory.splice(idx, 1);
    if (state.selectedItem === itemId) state.selectedItem = null;
    renderInventory();
    SaveManager.markDirty();      // ★ 新增
  }
}

/* ============================================================
 *  密码锁
 * ============================================================ */
function showPasswordLock(title, correctPassword, onSuccess, options = {}) {
  passwordTitle.textContent = title;
  const isTime = options.type === 'time';

  passwordSimple.style.display = isTime ? 'none' : 'block';
  passwordTime.style.display   = isTime ? 'flex' : 'none';

  if (isTime) {
    timeHour.value = ''; timeMinute.value = '';
    setTimeout(() => timeHour.focus(), 100);
  } else {
    passwordInput.value = '';
    setTimeout(() => passwordInput.focus(), 100);
  }

  passwordCallback = () => {
    let input;
    if (isTime) {
      const h = timeHour.value.trim();
      const m = timeMinute.value.trim();
      if (!h || !m) { showDialog('请填写完整的时间。'); return; }
      input = h + ':' + m;
    } else {
      input = passwordInput.value.trim();
      if (/^[a-z]+$/.test(input)) input = input.toUpperCase();
    }

    if (input === correctPassword) {
      passwordModal.classList.remove('show');
      passwordCallback = null;
      onSuccess();
    } else {
      showDialog('密码错误……');
      if (isTime) {
        timeHour.value = ''; timeMinute.value = ''; timeHour.focus();
      } else {
        passwordInput.value = ''; passwordInput.focus();
      }
    }
  };

  passwordModal.classList.add('show');
}

document.getElementById('password-confirm').addEventListener('click', () => {
  if (passwordCallback) passwordCallback();
});
document.getElementById('password-cancel').addEventListener('click', () => {
  passwordModal.classList.remove('show');
  passwordCallback = null;
});
passwordInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && passwordCallback) passwordCallback();
});
timeHour.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') timeMinute.focus();
});
timeMinute.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && passwordCallback) passwordCallback();
});

 * ============================================================ */
function resetNewGameState() {
  state.currentScene = gameData.startScene;
  state.inventory = [];
  state.flags = {};
  state.selectedItem = null;
  state.isTransitioning = false;
  state.busy = false;
  sceneLayer.style.opacity = '1';
  cameraExitBtn.classList.remove('show');
  storyOverlay.classList.remove('show');
  chapterOverlay.classList.remove('show', 'fade-out');
  dialogBox.classList.remove('show');
}

function refreshStartScreen() {
  const data = SaveManager.load();
  const loadBtn = document.getElementById('start-load-btn');
  const infoEl = document.getElementById('start-save-info');

  loadBtn.disabled = !data;
  if (!data) {
    infoEl.textContent = '暂无可用存档';
    return;
  }

  infoEl.textContent =
    '已有存档：第' + (data.chapter || '?') + '章 · ' + (data.sceneName || '未知场景') + '\n' +
    '保存时间：' + (data.savedAtText || '未知');
}

function startNewGame() {
  const existing = SaveManager.load();
  if (existing && !confirm('检测到已有存档。\n\n开始新游戏会覆盖当前进度，是否继续？')) {
    refreshStartScreen();
    return;
  }

  SaveManager.clear();
  resetNewGameState();
  tryPlayBgm();
  document.getElementById('start-screen').hidden = true;

  updateBackground();
  renderHotspots();
  renderInventory();
  SaveManager.startAutoSave();

  showChapter(1, () => {
    const scene = gameData.scenes[state.currentScene];
    if (scene && typeof scene.onEnter === 'function') scene.onEnter();
  });
}

function loadSavedGame() {
  const data = SaveManager.load();
  if (!data) {
    refreshStartScreen();
    return;
  }

  if (!gameData.scenes[data.currentScene]) {
    document.getElementById('start-save-info').textContent = '存档中的场景已经不存在，无法载入。';
    return;
  }

  if (!SaveManager.apply(data)) {
    document.getElementById('start-save-info').textContent = '存档读取失败。';
    return;
  }

  document.getElementById('start-screen').hidden = true;
  tryPlayBgm();
  SaveManager.startAutoSave();
  showDialog('已读取存档。', 1800);
}

function initGame() {
  resetNewGameState();
  updateBackground();
  renderHotspots();
  renderInventory();
  refreshStartScreen();

  document.getElementById('start-new-btn').addEventListener('click', startNewGame);
  document.getElementById('start-load-btn').addEventListener('click', loadSavedGame);

  tryPlayBgm();
}

initGame();

 * ============================================================ */
(function bindSaveUI() {
  const panel      = document.getElementById('save-panel');
  const toggleBtn  = document.getElementById('save-toggle-btn');
  const closeBtn   = document.getElementById('save-panel-close');
  const playerIn   = document.getElementById('save-player-id');
  const applyIdBtn = document.getElementById('save-apply-id');
  const infoEl     = document.getElementById('save-info');
  const saveBtn    = document.getElementById('save-btn');
  const loadBtn    = document.getElementById('load-btn');
  const exportBtn  = document.getElementById('export-btn');
  const importBtn  = document.getElementById('import-btn');
  const clearBtn   = document.getElementById('clear-btn');
  const fileIn     = document.getElementById('import-file');

  function refreshInfo() {
    const id = SaveManager.getPlayerId();
    const locked = SaveManager.isLoginPlayerLocked();
    playerIn.value = id;
    playerIn.readOnly = locked;
    playerIn.title = locked ? '当前玩家 ID 已与登录用户绑定' : '';
    applyIdBtn.disabled = locked;
    applyIdBtn.title = locked ? '登录用户的存档 ID 不能切换' : '';
    const data = SaveManager.load(id);
    if (!data) {
      infoEl.textContent = `玩家：${id}\n暂无存档`;
    } else {
      infoEl.textContent =
        `玩家：${id}\n` +
        `章节：第${data.chapter || '?'}章\n` +
        `场景：${data.sceneName || '未知'}\n` +
        `道具：${(data.inventory || []).length} 个\n` +
        `保存时间：${data.savedAtText || '未知'}`;
    }
  }

  toggleBtn.addEventListener('click', () => {
    panel.hidden = !panel.hidden;
    if (!panel.hidden) refreshInfo();
  });
  closeBtn.addEventListener('click', () => { panel.hidden = true; });

  applyIdBtn.addEventListener('click', () => {
    if (SaveManager.isLoginPlayerLocked()) {
      showDialog('当前玩家 ID 已与登录用户绑定，不能切换。');
      return;
    }
    const id = playerIn.value.trim();
    if (!SaveManager.setPlayerId(id)) {
      showDialog('玩家 ID 只能包含字母、数字、下划线、短横线（1-32位）。');
      return;
    }
    const data = SaveManager.load(id);
    if (data) {
      if (confirm(`玩家 ${id} 有存档：\n第${data.chapter}章 ${data.sceneName || ''}\n\n是否读取？`)) {
        SaveManager.apply(data);
      } else {
        refreshInfo();
      }
    } else {
      showDialog(`已切换到玩家 ${id}（该玩家暂无存档）。`);
    }
    refreshInfo();
  });

  saveBtn.addEventListener('click', () => {
    SaveManager.save(false);
    refreshInfo();
  });

  loadBtn.addEventListener('click', () => {
    const data = SaveManager.load();
    if (!data) { showDialog('当前玩家没有存档。'); return; }
    if (confirm(`读取存档：\n第${data.chapter}章 ${data.sceneName || ''}\n\n当前进度将被覆盖，是否继续？`)) {
      SaveManager.apply(data);
      panel.hidden = true;
      showDialog('已读取存档。');
    }
  });

  exportBtn.addEventListener('click', () => {
    SaveManager.exportFile();
  });

  importBtn.addEventListener('click', () => {
    fileIn.click();
  });

  fileIn.addEventListener('change', async () => {
    const f = fileIn.files[0];
    if (!f) return;
    try {
      const data = await SaveManager.importFile(f);
      showDialog('存档已导入。');
      if (confirm(`导入成功：\n玩家 ${data.playerId}\n第${data.chapter}章 ${data.sceneName || ''}\n\n是否立即读取？`)) {
        SaveManager.apply(data);
        panel.hidden = true;
      }
      refreshInfo();
    } catch (e) {
      showDialog('导入失败：' + e.message);
    } finally {
      fileIn.value = '';
    }
  });

  clearBtn.addEventListener('click', () => {
    if (!confirm('确定要删除当前玩家的存档吗？此操作无法撤销。')) return;
    SaveManager.clear();
    refreshInfo();
    showDialog('存档已删除。');
  });
})();

  const infoEl    = document.getElementById('debug-info');

  // ---------- 渲染章节按钮 ----------
  function renderChapterButtons() {
    listEl.innerHTML = '';
    debugChapters.forEach(ch => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.innerHTML =
        `<span class="ch-num">第 ${ch.chapter} 章</span>` +
        `<span class="ch-name">${ch.name}</span>`;
      btn.addEventListener('click', () => {
        if (!confirm(`跳转到【第 ${ch.chapter} 章 · ${ch.name}】？\n\n将自动发放前 ${ch.chapter - 1} 章的所有道具和进度。`)) return;
        jumpToChapter(ch.chapter);
      });
      listEl.appendChild(btn);
    });
  }

  // ---------- 跳转到指定章节 ----------
  function jumpToChapter(n) {
    // 1. 累积前置章节的道具和 flags
    const items = new Set();
    const flags = {};
    for (const ch of debugChapters) {
      if (ch.chapter > n) break;
      ch.items.forEach(i => items.add(i));
      Object.assign(flags, ch.flags);
    }

    // 2. 找到目标
    const target = debugChapters.find(c => c.chapter === n);
    if (!target) return;

    // 3. 重置状态
    state.currentScene = target.scene;
    state.inventory = Array.from(items);
    state.flags = flags;
    state.selectedItem = null;
    state.busy = false;
    state.isTransitioning = false;
    state.flags.cameraView = false;

    // 4. 刷新 UI
    updateBackground();
    renderHotspots();
    renderInventory();

    // 5. 触发目标场景的 onEnter（会自己处理章节标题、开场剧情）
    const scene = gameData.scenes[target.scene];
    if (scene && typeof scene.onEnter === 'function') {
      scene.onEnter();
    }

    // 6. 关闭面板 + 提示
    panel.hidden = true;
    showDialog(`已跳转到第 ${n} 章：${target.name}\n（调试模式 · 存档已封锁）`, 2600);
  }

  // ---------- 打开调试器 ----------
  function openDebug() {
    // 密码验证（复用游戏内的密码锁 UI）
    showPasswordLock('请输入调试密码', DEBUG_PASSWORD, () => {
      SaveManager.disabled = true;   // ★ 封锁存档
      renderChapterButtons();
      infoEl.textContent =
        `调试模式已开启，存档功能已封锁。\n` +
        `点击下方章节可直接跳转。\n` +
        `（刷新页面会自动退出调试模式）`;
      panel.hidden = false;
    });
  }

  // ---------- 关闭调试（回到第一章）----------
  function exitDebug() {
    if (!confirm('关闭调试模式？\n\n将回到第一章，并恢复存档功能。')) return;
    SaveManager.disabled = false;   // ★ 恢复存档

    // 重置到游戏初始状态
    state.currentScene = gameData.startScene;
    state.inventory = [];
    state.flags = {};
    state.selectedItem = null;
    state.busy = false;
    state.isTransitioning = false;

    updateBackground();
    renderHotspots();
    renderInventory();

    panel.hidden = true;

    // 重新播第一章开场
    showChapter(1, () => {
      const scene = gameData.scenes[state.currentScene];
      if (scene && scene.onEnter) scene.onEnter();
    });

    showDialog('已退出调试模式。\n存档功能已恢复。', 2400);
  }

  // ---------- 事件绑定 ----------
  toggleBtn.addEventListener('click', openDebug);
  closeBtn.addEventListener('click', () => { panel.hidden = true; });
  exitBtn.addEventListener('click', exitDebug);

  // 可选的快捷键：按 F9 打开调试器（方便测试）
  document.addEventListener('keydown', (e) => {
    if (e.key === 'F9') {
      e.preventDefault();
      openDebug();
    }
  });

/* ============================================================
 *  机关系统 Mechanism System
 * ============================================================ */
const mechanismRegistry = {};

function registerMechanism(id, config) {
  mechanismRegistry[id] = config;
}

function openMechanism(id) {
  const m = mechanismRegistry[id];
  if (!m) { console.warn('未注册的机关:', id); return; }
  state.flags._activeMech = id;
  document.getElementById('mechanism-title').textContent = m.title;
  document.getElementById('mechanism-hint').textContent = m.hint || '';
  renderMechanism();
  document.getElementById('mechanism-overlay').hidden = false;
  state.busy = true;
}

function closeMechanism() {
  document.getElementById('mechanism-overlay').hidden = true;
  state.flags._activeMech = null;
  state.busy = false;
}

function renderMechanism() {
  const id = state.flags._activeMech;
  const m = mechanismRegistry[id];
  if (!m) return;
  const body = document.getElementById('mechanism-body');
  body.innerHTML = '';

  m.parts.forEach(part => {
    const el = document.createElement('div');
    el.className = 'mech-part';
    const partState = (m.partState && m.partState[part.id]) || {};
    if (partState.opened) el.classList.add('opened');
    if (partState.locked) el.classList.add('locked');
    if (partState.highlight) el.classList.add('highlight');

    // 玩家正拿着需要的道具时，高亮
    if (part.accepts && state.selectedItem === part.accepts) {
      el.classList.add('highlight');
    }

    let html = `<div class="mech-icon">${part.icon || '⚙️'}</div>` +
               `<div class="mech-label">${part.label}</div>`;
    if (partState.badge) {
      html += `<span class="mech-badge">${partState.badge}</span>`;
    }
    el.innerHTML = html;

    el.addEventListener('click', (e) => {
      e.stopPropagation();
      if (state.busy === false) state.busy = true; // 保护
      if (m.onPartClick) m.onPartClick(part.id);
    });
    body.appendChild(el);
  });
}

// 关闭按钮
document.getElementById('mechanism-close').addEventListener('click', () => {
  closeMechanism();
});

/* 红门顺序谜题：按镜中提示 2 → 5 → 1 → 4 → 3 依次打开。 */
function tryRedDoor(n) {
  const order = [2, 5, 1, 4, 3];
  if (state.flags.ch11_rc_mirrorSolved) {
    showDialog('五扇门已经全部对齐。');
    return;
  }

  const step = state.flags.ch11_rc_doorStep || 0;
  if (n !== order[step]) {
    state.flags.ch11_rc_doorStep = 0;
    showDialog('——门纹丝不动。\\n\\n顺序似乎不对。\\n\\n（已重置）');
    return;
  }

  state.flags.ch11_rc_doorStep = step + 1;
  if (step + 1 === order.length) {
    state.flags.ch11_rc_mirrorSolved = true;
    showStory('五扇门依次打开。\\n\\n——每推开一扇，\\n怪物就远一步。', 4200, null);
  } else {
    showDialog(`门打开了。\\n\\n（${step + 1}/5）`);
  }
}

    { id: 'gear1', label: '齿轮 · 一', icon: '⚙️' },

    { id: 'gear4', label: '齿轮 · 四', icon: '⚙️' }
  ],
  partState: {},
  onPartClick: (partId) => {
    const ps = mechanismRegistry.oldMachine.partState;
    if (!ps[partId]) ps[partId] = {};

    // 顺序必须是 gear3 → gear1 → gear4 → gear2
    const order = ['gear3', 'gear1', 'gear4', 'gear2'];
    const currentIndex = Object.values(ps).filter(p => p.opened).length;
    const expected = order[currentIndex];

    if (partId !== expected) {
      // 错误，重置
      Object.keys(ps).forEach(k => ps[k].opened = false);
      showDialog('—— 咔。\n\n齿轮卡住了。\n\n似乎不是这个顺序。\n\n（已重置）');
      renderMechanism();
      return;
    }

    ps[partId].opened = true;
    showDialog('咔 —— 咬合了。');
    renderMechanism();

    if (Object.values(ps).filter(p => p.opened).length === 4) {
      state.flags.ch11_rc_machineOn = true;
      showStory('四个齿轮\n依次咬合。\n\n——机械装置\n轰然启动。', 4200, () => {
        closeMechanism();

  }
});

    { id: 'slotOrb', label: '微光插槽', icon: '🌐' },
    { id: 'slotEye', label: '眼球插槽', icon: '👁️' },
    { id: 'slotStart', label: '启动', icon: '▶️' }
  ],
  partState: {},
  onPartClick: (partId) => {
    const ps = mechanismRegistry.clockActivate.partState;
    if (!ps[partId]) ps[partId] = {};

    if (partId === 'slotCore') {
      if (ps.slotCore.opened) { showDialog('水晶已经嵌入。'); return; }
      if (state.selectedItem === 'ch11_shardFull') {
        state.selectedItem = null;
        removeItem('ch11_shardFull');
        ps.slotCore.opened = true;
        showDialog('你把水晶核心\n嵌入时空钟。');
        renderInventory();
        renderMechanism();
        return;
      }
      showDialog('需要一颗\n水晶核心。');
      return;
    }

    if (partId === 'slotOrb') {
      if (ps.slotOrb.opened) { showDialog('微光球已经嵌入。'); return; }
      if (state.selectedItem === 'ch11_glowOrb') {
        state.selectedItem = null;
        removeItem('ch11_glowOrb');
        ps.slotOrb.opened = true;
        showDialog('你把微光球\n嵌入时空钟。');
        renderInventory();
        renderMechanism();
        return;
      }
      showDialog('需要一颗\n微光球。');
      return;
    }

    if (partId === 'slotEye') {
      if (ps.slotEye.opened) { showDialog('眼球已经嵌入。'); return; }
      if (state.selectedItem === 'ch11_redEye') {
        state.selectedItem = null;
        removeItem('ch11_redEye');
        ps.slotEye.opened = true;
        showDialog('你把红色眼球\n嵌入时空钟。\n\n——它眨了眨。');
        renderInventory();
        renderMechanism();
        return;
      }
      showDialog('需要一颗\n怪物的眼球。');
      return;
    }

    if (partId === 'slotStart') {
      if (!ps.slotCore.opened || !ps.slotOrb.opened || !ps.slotEye.opened) {
        showDialog('三个插槽\n还没有全部嵌入。');
        return;
      }
      if (state.flags.ch11_dl_started) { showDialog('时空钟已经开始旋转。'); return; }
      state.flags.ch11_dl_started = true;
      showStory('时空钟\n开始旋转。\n\n——整个世界\n天旋地转。\n\n你伸出手，\n触到了它。', 5200, () => {
        closeMechanism();
        setTimeout(() => changeScene('normalWorld'), 800);
      });
    }
  }
});
})();

window.gameState = state;
window.gameData = gameData;
window.changeScene = changeScene;
</script>
</body>
</html>
